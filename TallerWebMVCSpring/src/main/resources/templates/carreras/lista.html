<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head}">
    <meta charset="UTF-8">
    <title>Carreras - Sistema de Gestión Académica</title>
</head>
<body>

<!-- Agregar el Navbar desde el fragment -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Contenido Principal -->
<main class="main-content container py-4">

    <!-- Título + botón -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-uaemex-verde mb-0">
            <i class="bi bi-mortarboard me-2"></i>Carreras
        </h2>
        <a th:href="@{/carreras/nuevo}" class="btn btn-uaemex">
            <i class="bi bi-plus-circle me-1"></i>Nueva Carrera
        </a>
    </div>

    <!-- Alerta de error -->
    <div th:if="${mensajeError}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-uaemex-verde text-white fw-bold">
            <i class="bi bi-list-ul me-2"></i>Listado de carreras
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Id</th>
                        <th>Siglas</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Estatus</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="carrera : ${carreras}">
                        <td th:text="${carrera.idCarrera}"></td>
                        <td th:text="${carrera.siglas}"></td>
                        <td th:text="${carrera.nombre}"></td>
                        <td th:text="${carrera.descripcion}"></td>
                        <td th:text="${carrera.estatus} ? 'Activo' : 'Inactivo'"></td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/carreras/editar/{id}(id=${carrera.idCarrera})}"
                                   class="btn btn-outline-uaemex btn-sm">
                                    <i class="bi bi-pencil-square me-1"></i>
                                </a>
                                <form th:action="@{/carreras/eliminar/{id}(id=${carrera.idCarrera})}"
                                      method="post" style="display: inline;"
                                      onsubmit="return confirm('¿Está seguro de eliminar esta carrera?');">
                                    <button type="submit"
                                            class="btn btn-outline-danger btn-sm">
                                        <i class="bi bi-trash me-1"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <!-- Fila vacía -->
                    <tr th:if="${carreras.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No hay carreras registradas
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
