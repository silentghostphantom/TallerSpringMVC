<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <th:block th:insert="~{fragments/header :: head}"></th:block>
    <title th:text="${id != null} ? 'Editar Carrera - Sistema de Gestión Académica' : 'Nueva Carrera - Sistema de Gestión Académica'">
        Formulario Carrera
    </title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="main-content container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-uaemex-verde mb-0">
            <i class="bi bi-mortarboard me-2"></i>
            <span th:text="${id != null} ? 'Editar Carrera' : 'Nueva Carrera'">Formulario Carrera</span>
        </h2>
        <a th:href="@{/carreras}" class="btn btn-outline-uaemex">
            <i class="bi bi-arrow-left me-1"></i>Volver al listado
        </a>
    </div>

    <!-- Alerta de error general -->
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-uaemex-verde text-white fw-bold">
            <i class="bi bi-pencil-square me-2"></i>Datos de la carrera
        </div>
        <div class="card-body">

            <!-- Acción dinámica según si hay id en el modelo -->
            <form th:action="${id != null} ? @{/carreras/editar/{id}(id=${id})} : @{/carreras/guardar}"
                  th:object="${carreraDto}" method="post" class="needs-validation" novalidate>

                <!-- SIGLAS -->
                <div class="mb-3">
                    <label for="siglas" class="form-label fw-bold">Siglas <span class="text-danger">*</span></label>
                    <input type="text" id="siglas" th:field="*{siglas}"
                           th:class="${#fields.hasErrors('siglas')} ? 'form-control is-invalid' : 'form-control'"
                           required maxlength="5" placeholder="Ej. LIA"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('siglas')}" th:errors="*{siglas}"></div>
                    <small class="form-text text-muted">Máximo 5 caracteres.</small>
                </div>

                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
                    <input type="text" id="nombre" th:field="*{nombre}"
                           th:class="${#fields.hasErrors('nombre')} ? 'form-control is-invalid' : 'form-control'"
                           required maxlength="100" placeholder="Ej. Licenciatura en Informática Administrativa"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <!-- DESCRIPCIÓN -->
                <div class="mb-3">
                    <label for="descripcion" class="form-label fw-bold">Descripción <span class="text-danger">*</span></label>
                    <textarea id="descripcion" th:field="*{descripcion}"
                              th:class="${#fields.hasErrors('descripcion')} ? 'form-control is-invalid' : 'form-control'"
                              rows="3" required maxlength="255"
                              placeholder="Breve descripción de la carrera..."></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                </div>

                <!-- ESTATUS -->
                <div class="mb-3 form-check">
                    <input type="checkbox" id="estatus" th:field="*{estatus}"
                           class="form-check-input"
                           th:classappend="${#fields.hasErrors('estatus')} ? 'is-invalid' : ''"/>
                    <label for="estatus" class="form-check-label fw-bold">Activa</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('estatus')}" th:errors="*{estatus}"></div>
                </div>

                <!-- ELIMINADO (oculto, por defecto false al crear) -->
                <input type="hidden" th:field="*{eliminado}"/>

                <hr class="my-4">

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-uaemex">
                        <i class="bi bi-save me-1"></i>Guardar
                    </button>
                    <a th:href="@{/carreras}" class="btn btn-secondary">
                        <i class="bi bi-x-circle me-1"></i>Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function(form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
