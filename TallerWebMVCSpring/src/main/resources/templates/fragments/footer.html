<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Footer</title>
</head>
<body>

<footer th:fragment="footer" class="footer-uaemex mt-auto py-4">
    <div class="container">
        <div class="row align-items-center gy-3">

            <!-- Logo + nombre -->
            <div class="col-md-6 text-center text-md-start">
                <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-2">
                    <img th:src="@{/img/logo.svg}" alt="Logo UAEMéx" width="32" height="32">
                    <div>
                        <div class="fw-bold text-white">UAEMéx · CUX</div>
                        <small class="text-white-50">Sistema de Gestión Académica</small>
                    </div>
                </div>
            </div>

            <!-- Autor + copyright + enlaces -->
            <div class="col-md-6 text-center text-md-end">
                <small class="text-white-50 d-block text-uaemex-oro">
                    <i>Taller MVC - Desarrollado por <span class="fw-bold text-white">Dr. José Asunción Enríquez Zárate</span></i>
                </small>
                <small class="text-white-50 d-block">
                    &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
                    UAEMéx. Todos los derechos reservados.
                </small>
                <small class="text-white-50">
                    <a href="#" class="footer-link">Aviso de privacidad</a>
                    <span class="mx-1">·</span>
                    <a href="#" class="footer-link">Soporte</a>
                </small>
            </div>

        </div>
    </div>
</footer>

</body>
</html>
