<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <th:block th:insert="~{fragments/header :: head}"></th:block>
    <title>Alumnos - Sistema de Gestión Académica</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="main-content container py-4">

    <!-- Título + botón -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-uaemex-verde mb-0">
            <i class="bi bi-people me-2"></i>Alumnos
        </h2>
        <a th:href="@{/alumnos/nuevo}" class="btn btn-uaemex">
            <i class="bi bi-plus-circle me-1"></i>Nuevo Alumno
        </a>
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${mensajeExito}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${mensajeError}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-uaemex-verde text-white fw-bold">
            <i class="bi bi-list-ul me-2"></i>Listado de alumnos
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Id</th>
                        <th>Nombre completo</th>
                        <th>Email</th>
                        <th>Carrera</th>
                        <th>Estatus</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="alumno : ${alumnos}">
                        <td th:text="${alumno.id}"></td>
                        <td>
                            <span th:text="${alumno.nombreAlumno}"></span>
                            <span th:text="' ' + ${alumno.paternoAlumno}"></span>
                            <span th:if="${alumno.maternoAlumno != null and !alumno.maternoAlumno.isEmpty()}"
                                  th:text="' ' + ${alumno.maternoAlumno}"></span>
                        </td>
                        <td>
                            <a th:href="'mailto:' + ${alumno.emailAlumno}"
                               th:text="${alumno.emailAlumno}"></a>
                        </td>
                        <td>
                            <span class="badge bg-secondary me-1"
                                  th:text="${alumno.siglasCarrera}"></span>
                            <span th:text="${alumno.nombreCarrera}"></span>
                        </td>
                        <td>
                            <span th:if="${alumno.estatus}"
                                  class="badge bg-success">Activo</span>
                            <span th:unless="${alumno.estatus}"
                                  class="badge bg-secondary">Inactivo</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/alumnos/editar/{id}(id=${alumno.id})}"
                                   class="btn btn-outline-uaemex">
                                    <i class="bi bi-pencil-square me-1"></i>Editar
                                </a>
                                <form th:action="@{/alumnos/eliminar/{id}(id=${alumno.id})}"
                                      method="post" style="display: inline;"
                                      onsubmit="return confirm('¿Está seguro de eliminar este alumno?');">
                                    <button type="submit"
                                            class="btn btn-outline-danger btn-sm">
                                        <i class="bi bi-trash me-1"></i>Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <!-- Fila vacía -->
                    <tr th:if="${alumnos.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No hay alumnos registrados
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
