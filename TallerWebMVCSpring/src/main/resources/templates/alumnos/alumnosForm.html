<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <th:block th:insert="~{fragments/header :: head}"></th:block>
    <title th:text="${id != null} ? 'Editar Alumno - Sistema de Gestión Académica' : 'Nuevo Alumno - Sistema de Gestión Académica'">
        Formulario Alumno
    </title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="main-content container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-uaemex-verde mb-0">
            <i class="bi bi-person-plus me-2"></i>
            <span th:text="${id != null} ? 'Editar Alumno' : 'Nuevo Alumno'">Formulario Alumno</span>
        </h2>
        <a th:href="@{/alumnos}" class="btn btn-outline-uaemex">
            <i class="bi bi-arrow-left me-1"></i>Volver al listado
        </a>
    </div>

    <!-- Alerta de error flash (mensajeError de RedirectAttributes) -->
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-uaemex-verde text-white fw-bold">
            <i class="bi bi-pencil-square me-2"></i>Datos del alumno
        </div>
        <div class="card-body">

            <form th:action="${id != null} ? @{/alumnos/editar/{id}(id=${id})} : @{/alumnos/guardar}"
                  th:object="${alumnoDto}" method="post" class="needs-validation" novalidate>

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                    </ul>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombreAlumno" class="form-label fw-bold">
                            Nombre <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="nombreAlumno" th:field="*{nombreAlumno}"
                               th:class="${#fields.hasErrors('nombreAlumno')} ? 'form-control is-invalid' : 'form-control'"
                               required maxlength="100" placeholder="Ej. Juan Carlos"/>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('nombreAlumno')}"
                             th:errors="*{nombreAlumno}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="paternoAlumno" class="form-label fw-bold">
                            Apellido paterno <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="paternoAlumno" th:field="*{paternoAlumno}"
                               th:class="${#fields.hasErrors('paternoAlumno')} ? 'form-control is-invalid' : 'form-control'"
                                required maxlength="100" placeholder="Ej. Pérez"/>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('paternoAlumno')}"
                             th:errors="*{paternoAlumno}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="maternoAlumno" class="form-label fw-bold">Apellido materno</label>
                        <input type="text" id="maternoAlumno" th:field="*{maternoAlumno}"
                               th:class="${#fields.hasErrors('maternoAlumno')} ? 'form-control is-invalid' : 'form-control'"
                               maxlength="100" placeholder="Ej. López (opcional)"/>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('maternoAlumno')}"
                             th:errors="*{maternoAlumno}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="emailAlumno" class="form-label fw-bold">
                            Email <span class="text-danger">*</span>
                        </label>
                        <input type="email" id="emailAlumno" th:field="*{emailAlumno}"
                               th:class="${#fields.hasErrors('emailAlumno')} ? 'form-control is-invalid' : 'form-control'"
                               required maxlength="150" placeholder="Ej. alumno@uaemex.mx"/>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('emailAlumno')}"
                             th:errors="*{emailAlumno}"></div>
                    </div>
                </div>

                <!-- Combo Carrera -->
                <div class="mb-3">
                    <label for="idCarrera" class="form-label fw-bold">
                        Carrera <span class="text-danger">*</span>
                    </label>
                    <select id="idCarrera" th:field="*{idCarrera}"
                            th:class="${#fields.hasErrors('idCarrera')} ? 'form-select is-invalid' : 'form-select'"
                            required>
                        <option value="">-- Seleccione una carrera --</option>
                        <option th:each="carrera : ${carreras}"
                                th:value="${carrera.idCarrera}"
                                th:text="${carrera.siglas + ' · ' + carrera.nombre}">
                            ICO · Ingeniería en Computación
                        </option>
                    </select>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('idCarrera')}"
                         th:errors="*{idCarrera}"></div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" id="estatus" th:field="*{estatus}"
                           class="form-check-input"
                           th:classappend="${#fields.hasErrors('estatus')} ? 'is-invalid' : ''"/>
                    <label for="estatus" class="form-check-label fw-bold">Activo</label>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('estatus')}"
                         th:errors="*{estatus}"></div>
                </div>

                <input type="hidden" th:field="*{eliminado}"/>

                <hr class="my-4">

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-uaemex">
                        <i class="bi bi-save me-1"></i>Guardar
                    </button>
                    <a th:href="@{/alumnos}" class="btn btn-secondary">
                        <i class="bi bi-x-circle me-1"></i>Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function(form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
