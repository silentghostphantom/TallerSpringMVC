spring.application.name=TallerWebMVCSpring

# Conexión MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/TallerSpringMVC?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Fantasma1}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Conexión MySQL
