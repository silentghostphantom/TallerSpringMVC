<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head}">
    <title>Error - Sistema de Gestión Académica</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="main-content container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 overflow-hidden">
                <div class="card-header bg-uaemex-verde text-white border-bottom border-warning border-3 py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-exclamation-octagon me-2"></i>
                        Error <span th:if="${status}" th:text="'(' + ${status} + ')'"></span>
                    </h4>
                </div>

                <div class="card-body text-center pt-4 pb-4">
                    <i class="bi bi-emoji-frown display-4 text-uaemex-verde d-block mb-3"></i>
                    <p class="card-text fw-bold fs-5 text-dark"
                       th:text="${error} ?: 'Ha ocurrido un error inesperado'">
                        Ha ocurrido un error inesperado
                    </p>
                    <p class="card-text small text-muted"
                       th:if="${message}"
                       th:text="${message}"></p>
                    <p class="card-text small text-muted mb-4"
                       th:if="${path}"
                       th:text="'Ruta: ' + ${path}"></p>

                    <div class="d-flex gap-2 justify-content-center">
                        <a th:href="@{/}" class="btn btn-uaemex">
                            <i class="bi bi-house-door me-1"></i>Volver al inicio
                        </a>
                        <a href="javascript:history.back()" class="btn btn-outline-uaemex">
                            <i class="bi bi-arrow-left me-1"></i>Regresar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
